<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Evidence Axis">
  <rect width="32" height="32" rx="6" fill="#14171c"/>
  <!-- the axis -->
  <line x1="20" y1="6" x2="20" y2="26" stroke="#5a76ad" stroke-width="1.6"/>
  <!-- evidence fragments aligning to the axis -->
  <!-- fact: solid, fully aligned -->
  <line x1="9" y1="10.5" x2="20" y2="10.5" stroke="#dcebe4" stroke-width="1.6"/>
  <circle cx="20" cy="10.5" r="2.4" fill="#3f9b7f"/>
  <!-- inference: dashed, reasoned -->
  <line x1="11" y1="16" x2="20" y2="16" stroke="#e6c896" stroke-width="1.6" stroke-dasharray="2 2"/>
  <circle cx="20" cy="16" r="2.4" fill="#a9682a"/>
  <path d="M20 13.6 A2.4 2.4 0 0 1 20 18.4 Z" fill="#e6c896"/>
  <!-- unknown: open, unresolved -->
  <line x1="13" y1="21.5" x2="20" y2="21.5" stroke="#949aa4" stroke-width="1.6" stroke-dasharray="1 2.5"/>
  <circle cx="20" cy="21.5" r="2.2" fill="none" stroke="#949aa4" stroke-width="1.4"/>
</svg>
