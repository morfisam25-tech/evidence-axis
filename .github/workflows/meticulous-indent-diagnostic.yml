name: meticulous-indent-diagnostic

on:
  push:
    branches: [meticulous-brief-hanging-indent-patch]
    paths:
      - '.github/workflows/meticulous-indent-diagnostic.yml'
      - 'docs/meticulous-indent-diagnostic-trigger.txt'
      - 'docs/meticulous-indent-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF QA tooling and Noto Sans
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --disable-pip-version-check pymupdf pillow numpy

      - name: Patch hanging indents only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz, json, re, hashlib, subprocess
          from pathlib import Path
          from collections import Counter
          from PIL import Image
          import numpy as np

          src = Path('public/deliveries/meticulous-brief-fed5761c/deck.pdf')
          outdir = Path('artifacts/meticulous-brief-indent-patch')
          outdir.mkdir(parents=True, exist_ok=True)
          dst = outdir / 'Evidence_Axis_Meticulous_Executive_Brief_FINAL_QA_R5.pdf'

          original = fitz.open(src)
          if original.page_count != 8:
              raise SystemExit(f'Expected 8 pages, got {original.page_count}')

          noto_path = subprocess.check_output(
              ['fc-match', '-f', '%{file}', 'Noto Sans:style=Regular'], text=True
          ).strip()
          if not noto_path or not Path(noto_path).exists():
              raise SystemExit(f'Noto Sans Regular not found: {noto_path!r}')
          print('Using font:', noto_path)

          work = fitz.open(src)
          labels = {'FACT', 'INFERENCE', 'UNKNOWN', 'GUARDRAIL', 'ATTRIBUTED CLAIM'}
          affected_expected = {2, 3, 4, 5, 7, 8}
          patch_log = []

          def rgb_from_int(c):
              return ((c >> 16 & 255) / 255.0, (c >> 8 & 255) / 255.0, (c & 255) / 255.0)

          def line_records(page):
              data = page.get_text('dict', flags=fitz.TEXTFLAGS_TEXT)
              lines = []
              for block in data.get('blocks', []):
                  if block.get('type') != 0:
                      continue
                  for line in block.get('lines', []):
                      spans = line.get('spans', [])
                      text = ''.join(s.get('text', '') for s in spans).strip()
                      if not text or not spans:
                          continue
                      s0 = spans[0]
                      lines.append({
                          'text': text,
                          'bbox': tuple(line.get('bbox')),
                          'origin': tuple(s0.get('origin')),
                          'font': s0.get('font'),
                          'size': float(s0.get('size')),
                          'color': int(s0.get('color')),
                      })
              return lines

          for pno in range(work.page_count):
              page_num = pno + 1
              page = work[pno]
              lines = line_records(page)
              label_lines = [ln for ln in lines if ln['text'] in labels]
              if not label_lines:
                  continue

              planned = []
              boundaries = sorted(
                  ln['bbox'][1] for ln in lines
                  if ln['text'] in labels or ln['text'].startswith('[') or ln['text'].startswith('Evidence Axis |')
              )

              for lab in label_lines:
                  ly0, ly1 = lab['bbox'][1], lab['bbox'][3]
                  first_candidates = [
                      ln for ln in lines
                      if ln['bbox'][0] > lab['bbox'][2] + 5
                      and ln['size'] >= 15
                      and ln['bbox'][1] >= ly0 - 20
                      and ln['bbox'][1] <= ly1 + 4
                  ]
                  if not first_candidates:
                      continue
                  first = min(first_candidates, key=lambda ln: (abs(ln['bbox'][1] - ly0), ln['bbox'][0]))
                  target_x = first['bbox'][0]
                  later_bounds = [y for y in boundaries if y > ly0 + 4]
                  end_y = min(later_bounds) if later_bounds else 500.0
                  continuations = [
                      ln for ln in lines
                      if ln['bbox'][1] > first['bbox'][1] + 2
                      and ln['bbox'][1] < end_y - 1
                      and abs(ln['size'] - first['size']) < 0.35
                      and ln['font'] == first['font']
                      and ln['bbox'][0] < target_x - 1.0
                  ]
                  for ln in continuations:
                      planned.append((lab, first, ln, target_x))

              dedup = {}
              for item in planned:
                  ln = item[2]
                  dedup[(round(ln['bbox'][1], 2), ln['text'])] = item
              planned = list(dedup.values())

              for lab, first, ln, target_x in planned:
                  x0, y0, x1, y1 = ln['bbox']
                  page.add_redact_annot(fitz.Rect(x0 - 0.7, y0 - 0.5, x1 + 0.7, y1 + 0.5), fill=(1, 1, 1))
              if planned:
                  page.apply_redactions()

              # Identical text, same baseline / font size / color; only X changes.
              for lab, first, ln, target_x in planned:
                  page.insert_text(
                      (target_x, ln['origin'][1]),
                      ln['text'],
                      fontsize=ln['size'],
                      fontname='NotoSansR5',
                      fontfile=noto_path,
                      color=rgb_from_int(ln['color']),
                      overlay=True,
                  )
                  patch_log.append({
                      'page': page_num,
                      'label': lab['text'],
                      'text': ln['text'],
                      'old_x': round(ln['bbox'][0], 2),
                      'new_x': round(target_x, 2),
                      'baseline_y': round(ln['origin'][1], 2),
                      'size': round(ln['size'], 2),
                  })

          work.save(dst, garbage=4, deflate=True)
          work.close()

          patched = fitz.open(dst)
          changed_pages = {r['page'] for r in patch_log}
          if changed_pages != affected_expected:
              raise SystemExit(f'Unexpected changed pages: {sorted(changed_pages)} expected {sorted(affected_expected)}')

          token_re = re.compile(r'\S+')
          content_checks = []
          for pno in range(original.page_count):
              a = Counter(token_re.findall(original[pno].get_text('text')))
              b = Counter(token_re.findall(patched[pno].get_text('text')))
              ok = a == b
              content_checks.append({'page': pno + 1, 'token_multiset_equal': ok})
              if not ok:
                  missing = list((a - b).elements())[:20]
                  added = list((b - a).elements())[:20]
                  raise SystemExit(f'Content mismatch page {pno+1}: missing={missing} added={added}')

          # Verify each moved line now begins at the intended X and still extracts as the exact original string.
          geometry_checks = []
          for rec in patch_log:
              page = patched[rec['page'] - 1]
              matches = [
                  ln for ln in line_records(page)
                  if ln['text'] == rec['text'] and abs(ln['bbox'][1] - (rec['baseline_y'] - ln['size'])) < 14
              ]
              if not matches:
                  # Baseline-based search can vary slightly by font metrics; fall back to exact text.
                  matches = [ln for ln in line_records(page) if ln['text'] == rec['text']]
              if not matches:
                  raise SystemExit(f'Reinserted line not extractable on page {rec["page"]}: {rec["text"][:60]}')
              best = min(matches, key=lambda ln: abs(ln['bbox'][0] - rec['new_x']))
              aligned = abs(best['bbox'][0] - rec['new_x']) <= 1.5
              geometry_checks.append({
                  'page': rec['page'],
                  'text': rec['text'],
                  'target_x': rec['new_x'],
                  'actual_x': round(best['bbox'][0], 2),
                  'aligned': aligned,
              })
              if not aligned:
                  raise SystemExit(f'Alignment mismatch page {rec["page"]}: {best["bbox"][0]} vs {rec["new_x"]}')

          diff_checks = []
          matrix = fitz.Matrix(1.5, 1.5)
          for pno in range(original.page_count):
              op = original[pno].get_pixmap(matrix=matrix, alpha=False)
              pp = patched[pno].get_pixmap(matrix=matrix, alpha=False)
              oa = np.array(Image.frombytes('RGB', [op.width, op.height], op.samples))
              pa = np.array(Image.frombytes('RGB', [pp.width, pp.height], pp.samples))
              diff = np.any(oa != pa, axis=2)
              count = int(diff.sum())
              ratio = count / diff.size
              bbox = None
              if count:
                  ys, xs = np.where(diff)
                  bbox = [int(xs.min()), int(ys.min()), int(xs.max()), int(ys.max())]
              diff_checks.append({'page': pno + 1, 'changed_pixels': count, 'ratio': ratio, 'bbox_px': bbox})
              if (pno + 1) in {1, 6} and count != 0:
                  raise SystemExit(f'Unaffected page {pno+1} changed visually ({count} pixels)')
              if (pno + 1) in affected_expected and not (0 < ratio < 0.08):
                  raise SystemExit(f'Unexpected visual diff ratio on page {pno+1}: {ratio}')

          report = {
              'status': 'PASS',
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'patched_sha256': hashlib.sha256(dst.read_bytes()).hexdigest(),
              'page_count': patched.page_count,
              'affected_pages': sorted(changed_pages),
              'patch_count': len(patch_log),
              'content_checks': content_checks,
              'geometry_checks': geometry_checks,
              'visual_diff_checks': diff_checks,
              'patch_log': patch_log,
          }
          (outdir / 'QA_REPORT.json').write_text(json.dumps(report, indent=2), encoding='utf-8')

          render_dir = outdir / 'renders'
          render_dir.mkdir(exist_ok=True)
          rmat = fitz.Matrix(2.0, 2.0)
          for pno in range(patched.page_count):
              pix = patched[pno].get_pixmap(matrix=rmat, alpha=False)
              pix.save(render_dir / f'page-{pno+1:02d}.png')

          print(json.dumps({k: report[k] for k in ['status','source_sha256','patched_sha256','affected_pages','patch_count']}, indent=2))
          PY

      - name: Upload patched brief and QA renders
        uses: actions/upload-artifact@v4
        with:
          name: meticulous-brief-r5-indent-fixed
          path: artifacts/meticulous-brief-indent-patch/
          if-no-files-found: error
          retention-days: 7
