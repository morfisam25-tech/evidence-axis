name: tracking-v4-smoke-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tracking-v4-smoke-once.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for production deployment
        run: sleep 75
      - name: Install Playwright
        run: |
          mkdir -p /tmp/ea-smoke
          cd /tmp/ea-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test production and capture result
        run: |
          cd /tmp/ea-smoke
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const token = `EA-SMOKE-V4-${Date.now()}`;
          const url = `https://evidenceaxis.com/intelligence/cloverleaf-brief-8d7c1f4a/?d=${token}`;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const responses = [];
          const failures = [];
          const consoleErrors = [];
          page.on('response', r => {
            const u = r.url();
            if (u.includes('delivery-tracking-v4.js') || u.includes('formsubmit.co') || u.includes('ipify.org')) responses.push({url:u,status:r.status()});
          });
          page.on('requestfailed', r => {
            const u = r.url();
            if (u.includes('delivery-tracking-v4.js') || u.includes('formsubmit.co') || u.includes('ipify.org')) failures.push({url:u,error:r.failure()?.errorText || 'unknown'});
          });
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          let status = 'FAIL';
          let error = '';
          let debug = null;
          try {
            const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (!res || !res.ok()) throw new Error(`delivery page HTTP ${res?.status()}`);
            const count = await page.locator('script[src*="delivery-tracking-v4.js"]').count();
            if (!count) throw new Error('tracking v4 script tag missing on production');
            await page.waitForTimeout(7000);
            const deck = page.locator('[data-delivery-event="executive-deck-opened"]');
            if (!(await deck.count())) throw new Error('deck link missing');
            await deck.click({ modifiers: ['Control'] }).catch(async () => { await deck.click(); });
            await page.waitForTimeout(5000);
            debug = await page.evaluate(() => window.__eaTrackingV4 || null);
            if (!debug) throw new Error('window.__eaTrackingV4 missing');
            if (!debug.emitted?.some(x => x.event === 'delivery-page-viewed')) throw new Error('page-view event not emitted');
            if (!debug.submitted?.some(x => x.event === 'delivery-page-viewed')) throw new Error('page-view event not submitted');
            status = 'PASS';
          } catch (e) { error = String(e?.stack || e); }
          const result = {
            status, token, url, tested_at_utc: new Date().toISOString(),
            responses, failures, consoleErrors, debug, error
          };
          writeFileSync('/tmp/ea-smoke/result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          await browser.close();
          if (status !== 'PASS') process.exitCode = 1;
          EOF
          node smoke.mjs || true
          cp /tmp/ea-smoke/result.json "$GITHUB_WORKSPACE/docs/tracking-v4-smoke-result.json"
      - name: Commit smoke result
        run: |
          git config user.name "Evidence Axis Automation"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/tracking-v4-smoke-result.json
          git commit -m "Record production tracking v4 smoke result" || exit 0
          git push origin HEAD:main
