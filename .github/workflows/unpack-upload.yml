name: Unpack uploaded Evidence Axis source

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unpack source into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .unpack
          mkdir .unpack
          unzip -q "${{ steps.zip.outputs.zip }}" -d .unpack
          SRC=".unpack"
          if [ -d ".unpack/evidence-axis" ]; then SRC=".unpack/evidence-axis"; fi
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.unpack' \
            ! -name '*.zip' \
            -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf .unpack
          rm -f ./*.zip

      - name: Set launch contact email and SVG OG image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/config/site.ts')
          s = p.read_text()
          s = s.replace("email: null as string | null, // PRE-LAUNCH: real inbox to be decided", "email: 'hello@evidenceaxis.com' as string | null")
          s = s.replace("emailDisplay: 'Contact via the inquiry form', // shown until a real address exists", "emailDisplay: 'hello@evidenceaxis.com'")
          p.write_text(s)
          p = Path('src/components/BaseHead.astro')
          if p.exists():
              s = p.read_text().replace("/og-image.png", "/og-image.svg")
              p.write_text(s)
          PY

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Evidence Axis Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import final Evidence Axis source for deployment' || exit 0
          git push
