name: Final Evidence Axis site completion

on:
  push:
    branches:
      - redesign-v10
    paths:
      - 'final-site-completion.ready'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final completion pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------- HERO: make every cylinder box clickable ----------
          p = Path('src/components/Hero.astro')
          s = p.read_text()
          s = s.replace(
              '<div class="axis-state axis-state--fact"><span>FACT</span><b>verified</b></div>',
              '<a class="axis-state axis-state--fact" href="/method/#evidence-states" aria-label="See how Evidence Axis defines verified facts"><span>FACT</span><b>verified</b></a>'
          )
          s = s.replace(
              '<div class="axis-state axis-state--inference"><span>INFERENCE</span><b>reasoned</b></div>',
              '<a class="axis-state axis-state--inference" href="/method/#evidence-chain" aria-label="See how Evidence Axis handles reasoned inference"><span>INFERENCE</span><b>reasoned</b></a>'
          )
          s = s.replace(
              '<div class="axis-state axis-state--unknown"><span>UNKNOWN</span><b>unresolved</b></div>',
              '<a class="axis-state axis-state--unknown" href="/method/#limitations" aria-label="See how Evidence Axis handles unresolved unknowns"><span>UNKNOWN</span><b>unresolved</b></a>'
          )
          s = s.replace('class="axis-tag axis-tag--pricing" href="#services"', 'class="axis-tag axis-tag--pricing" href="/#services"')
          s = s.replace('class="axis-tag axis-tag--docs" href="/method/"', 'class="axis-tag axis-tag--docs" href="/method/#workflow"')
          if 'FINAL-CYLINDER-LINK-PASS' not in s:
              s += '''\n<style>\n/* FINAL-CYLINDER-LINK-PASS */\n.axis-stage .axis-state{cursor:pointer;text-decoration:none;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;}\n.axis-stage .axis-state:hover,.axis-stage .axis-state:focus-visible{filter:brightness(1.16);box-shadow:0 18px 46px rgba(0,0,0,.32),0 0 0 1px currentColor inset;outline:none;}\n.axis-stage .axis-state--fact:hover,.axis-stage .axis-state--fact:focus-visible{transform:translateX(-50%) translateY(-3px);}\n.axis-stage .axis-state--inference:hover,.axis-stage .axis-state--inference:focus-visible{transform:translateX(-50%) translateY(-3px);}\n.axis-stage .axis-state--unknown:hover,.axis-stage .axis-state--unknown:focus-visible{transform:translateX(-50%) translateY(-3px);}\n</style>\n'''
          p.write_text(s)

          # ---------- METHOD: stable anchors for hero cards ----------
          p = Path('src/pages/method.astro')
          s = p.read_text()
          s = s.replace('<section class="section container">\n    <SectionIntro\n      eyebrow="The core distinction"', '<section class="section container" id="evidence-states">\n    <SectionIntro\n      eyebrow="The core distinction"', 1)
          s = s.replace('<section class="section" data-surface="dark">\n    <div class="container">\n      <SectionIntro\n        eyebrow="Traceable reasoning"', '<section class="section" data-surface="dark" id="evidence-chain">\n    <div class="container">\n      <SectionIntro\n        eyebrow="Traceable reasoning"', 1)
          s = s.replace('<section class="section container">\n    <SectionIntro\n      eyebrow="The sequence"', '<section class="section container" id="workflow">\n    <SectionIntro\n      eyebrow="The sequence"', 1)
          # Find second dark section (disciplines) safely
          needle = '<section class="section" data-surface="dark">\n    <div class="container">\n      <SectionIntro\n        eyebrow="What the discipline covers"'
          s = s.replace(needle, '<section class="section" data-surface="dark" id="limitations">\n    <div class="container">\n      <SectionIntro\n        eyebrow="What the discipline covers"', 1)
          p.write_text(s)

          # ---------- COMPETITOR BRIEF: useful anchors ----------
          p = Path('src/pages/competitor-brief.astro')
          s = p.read_text()
          s = s.replace('<!-- OFFERS -->\n  <section class="section container">', '<!-- OFFERS -->\n  <section class="section container" id="engagements">', 1)
          s = s.replace('<!-- WHAT YOU RECEIVE -->\n  <section class="section container">', '<!-- WHAT YOU RECEIVE -->\n  <section class="section container" id="deliverables">', 1)
          p.write_text(s)

          # ---------- ABOUT: remove launch-stage / weak trust language ----------
          p = Path('src/pages/about.astro')
          s = p.read_text()
          s = s.replace(
              'Evidence Axis exists because most competitor work confuses information with clarity. The practice is small and focused by design, and its standards are the product.',
              'Evidence Axis exists because competitor information is abundant, but decision-grade evidence is not. The practice is deliberately focused around one standard: every material finding must be understandable, traceable and honest about uncertainty.'
          )
          old = '''        The work is asynchronous and founder-led at launch. That is a deliberate choice, not a
        limitation to disguise: it keeps the standards consistent and the method close to the work.
        What earns trust here is not scale or a client logo wall — it is the quality of the analysis,
        the honesty about uncertainty, and the fact that every finding can be checked.'''
          new = '''        Engagements are asynchronous and tightly scoped so the research stays close to the decision.
        Trust comes from the work itself: identifiable sources, visible evidence states, explicit limitations,
        and a line of reasoning that can be checked rather than simply accepted.'''
          s = s.replace(old, new)
          if 'ABOUT-VISUAL-PASS' not in s:
              marker = '  <section class="section container">\n    <div class="about-lead measure">'
              visual = '''  <!-- ABOUT-VISUAL-PASS -->\n  <section class="about-visual-section">\n    <div class="container-wide">\n      <figure class="about-visual-frame">\n        <img src="/assets/v10/decision-room.svg" alt="Evidence Axis decision room showing evidence states and source-backed reasoning" loading="eager" />\n        <figcaption><span>THE STANDARD</span><b>Source → evidence state → reasoning → decision</b></figcaption>\n      </figure>\n    </div>\n  </section>\n\n'''
              s = s.replace(marker, visual + marker, 1)
              s += '''\n<style>\n.about-visual-section{padding:2rem 0 0;background:linear-gradient(180deg,#07111f,#f7f2ea 88%);}\n.about-visual-frame{position:relative;margin:0;overflow:hidden;border-radius:1.4rem;border:1px solid rgba(105,164,235,.28);box-shadow:0 34px 80px rgba(11,24,42,.26);background:#06111e;}\n.about-visual-frame img{display:block;width:100%;height:auto;max-height:38rem;object-fit:cover;}\n.about-visual-frame figcaption{position:absolute;left:1rem;right:1rem;bottom:1rem;display:flex;gap:.7rem;align-items:center;padding:.75rem .9rem;border-radius:.72rem;background:rgba(2,9,19,.76);backdrop-filter:blur(12px);color:#fff;}\n.about-visual-frame figcaption span{font:800 .62rem/1 var(--font-mono);letter-spacing:.13em;color:#58ded7;}\n.about-visual-frame figcaption b{font:700 .82rem/1.2 var(--font-display);}\n</style>\n'''
          p.write_text(s)

          # ---------- HOMEPAGE ----------
          p = Path('src/pages/index.astro')
          s = p.read_text()

          # Replace broken external/local video element with a reliable CSS motion film.
          player_pattern = re.compile(r'<div class="film-v10__player">.*?</div>\s*<figure class="film-v10__card film-v10__card--a">', re.S)
          motion = '''<div class="film-v10__player film-v10__player--motion" aria-label="24-second Evidence Axis system film playing automatically">\n            <div class="system-reel" aria-hidden="true">\n              <figure class="system-reel__slide system-reel__slide--1"><img src="/assets/v10/global-signal.webp" alt="" /><figcaption><small>01 · PUBLIC SOURCE</small><b>Find the evidence that bears on the decision.</b></figcaption></figure>\n              <figure class="system-reel__slide system-reel__slide--2"><img src="/assets/v10/evidence-matrix.svg" alt="" /><figcaption><small>02 · CLASSIFY</small><b>Separate Fact, Inference and Unknown.</b></figcaption></figure>\n              <figure class="system-reel__slide system-reel__slide--3"><img src="/assets/v10/decision-dashboard.webp" alt="" /><figcaption><small>03 · COMPARE</small><b>Put the evidence against the dimensions that matter.</b></figcaption></figure>\n              <figure class="system-reel__slide system-reel__slide--4"><img src="/assets/v10/ai-comparison.svg" alt="" /><figcaption><small>04 · TRACE</small><b>Keep reasoning attached to identifiable sources.</b></figcaption></figure>\n              <figure class="system-reel__slide system-reel__slide--5"><img src="/assets/v10/decision-brief.svg" alt="" /><figcaption><small>05 · SYNTHESIZE</small><b>Turn the record into decision implications.</b></figcaption></figure>\n              <figure class="system-reel__slide system-reel__slide--6"><img src="/assets/v10/command-center-approved.svg" alt="" /><figcaption><small>06 · DECIDE</small><b>Know what the evidence supports — and where it stops.</b></figcaption></figure>\n            </div>\n            <div class="film-v10__frame"><span>24-SECOND AUTO SYSTEM FILM</span><b>Evidence Axis / source → state → decision</b></div>\n          </div>\n          <figure class="film-v10__card film-v10__card--a">'''
          s, n = player_pattern.subn(motion, s, count=1)

          # Make film floating cards different from the gallery below.
          s = s.replace('<figure class="film-v10__card film-v10__card--a"><img src="/assets/v10/corporate-strategy.webp" alt="Strategy team studying a global evidence map" /><figcaption>GLOBAL SIGNALS</figcaption></figure>', '<figure class="film-v10__card film-v10__card--a"><img src="/assets/v10/global-signal.svg" alt="Global market signal interface" /><figcaption>GLOBAL SIGNALS</figcaption></figure>')
          s = s.replace('<figure class="film-v10__card film-v10__card--b"><img src="/assets/v10/command-center.webp" alt="Business team studying strategic evidence" /><figcaption>DECISION ROOM</figcaption></figure>', '<figure class="film-v10__card film-v10__card--b"><img src="/assets/v10/decision-room.svg" alt="Decision room evidence interface" /><figcaption>DECISION ROOM</figcaption></figure>')

          # Remove duplicated images in the six-output grid while retaining the approved design direction.
          s = s.replace('/assets/v10/approved/what-you-get.webp" alt="Evidence Axis evidence matrix sample', '/assets/v10/evidence-matrix.svg" alt="Evidence Axis evidence matrix sample', 1)
          s = s.replace('/assets/v10/approved/decision-ready-showcase.webp" alt="Evidence Axis decision-ready output', '/assets/v10/decision-brief.svg" alt="Evidence Axis decision-ready output', 1)
          s = s.replace('/assets/v10/approved/decision-ready-showcase.webp" alt="Evidence Axis decision dashboard', '/assets/v10/decision-dashboard.webp" alt="Evidence Axis decision dashboard', 1)
          s = s.replace('/assets/v10/approved/generic-ai-vs-evidence-axis.webp" alt="Structured evidence compared with generic AI output', '/assets/v10/ai-comparison.svg" alt="Structured evidence compared with generic AI output', 1)
          s = s.replace('/assets/v10/approved/what-you-get.webp" alt="Evidence Axis workflow interface', '/assets/v10/approved-visual-gallery.webp" alt="Evidence Axis workflow interface', 1)
          s = s.replace('/assets/v10/approved/global-trading-command-center.webp" alt="Business team reviewing strategic evidence', '/assets/v10/decision-room.svg" alt="Business team reviewing strategic evidence', 1)

          # Make sample visual unique instead of repeating command-center.
          s = s.replace('<figure class="v10-media v10-media--sample"><img src="/assets/v10/command-center.webp"', '<figure class="v10-media v10-media--sample"><img src="/assets/v10/approved/sample-report-showcase.webp"', 1)

          # Add a clear buyer-facing explanation of exactly what is purchased and delivered.
          if 'EXACTLY-WHAT-YOU-GET' not in s:
              deliverables = '''\n    <!-- EXACTLY-WHAT-YOU-GET -->\n    <section class="deliverables-v10" id="what-you-get" aria-labelledby="deliverables-v10-title">\n      <div class="container-wide">\n        <header class="deliverables-v10__head">\n          <div><span class="v10-kicker">EXACTLY WHAT YOU ARE PAYING FOR</span><h2 id="deliverables-v10-title">From your question to a brief you can verify.</h2></div>\n          <p>No mystery box. You supply the decision and competitors. We investigate the public record, label the evidence state, show the reasoning and return the decision implications with the evidence trail attached.</p>\n        </header>\n        <div class="deliverables-v10__grid">\n          <article><span>01</span><small>YOU SEND</small><h3>The decision question.</h3><p>Your company/product URL if relevant, the named competitors, and the context that changes what “better” means.</p></article>\n          <article><span>02</span><small>WE INVESTIGATE</small><h3>The public evidence that matters.</h3><p>Positioning, pricing, packaging, product/docs evidence, changelogs, public review signals and contradictions — only where they bear on the question.</p></article>\n          <article><span>03</span><small>WE CLASSIFY</small><h3>Fact. Inference. Unknown.</h3><p>Verified observations stay separate from interpretation. Missing or conflicting evidence remains visible instead of being guessed away.</p></article>\n          <article><span>04</span><small>YOU RECEIVE</small><h3>The decision brief.</h3><p>An executive decision summary, evidence matrix, source-backed findings, contradictions/limitations and decision implications.</p></article>\n          <article><span>05</span><small>ALSO INCLUDED</small><h3>The source register.</h3><p>Identifiable public sources and check dates behind material findings, so you can walk a conclusion back to the record yourself.</p></article>\n          <article><span>06</span><small>THE RESULT</small><h3>A clearer decision boundary.</h3><p>What the evidence supports, what it does not support, what remains unresolved and what is worth checking next.</p></article>\n        </div>\n        <div class="deliverables-v10__bottom"><b>Two-Competitor Brief:</b><span>{offers.twoCompetitor.priceDisplay} pilot · {offers.twoCompetitor.delivery}</span><a href="/competitor-brief/#deliverables">See the full deliverable →</a></div>\n      </div>\n    </section>\n'''
              s = s.replace('    <section class="outputs-v10" aria-labelledby="outputs-title">', deliverables + '\n    <section class="outputs-v10" aria-labelledby="outputs-title">', 1)

          # The old video-control JS is harmless, but remove it so the motion film is fully CSS/autoplay.
          s = re.sub(r'\n<script>\n\s*const film = document\.querySelector\(\'\[data-system-film\]\'\);.*?</script>\s*$', '\n', s, flags=re.S)
          p.write_text(s)

          # ---------- HOMEPAGE CSS: compact pricing, motion film, readable images, deliverables ----------
          p = Path('src/styles/home-final.css')
          s = p.read_text()
          # Compact pricing enough to expose the next section sooner on desktop.
          s = s.replace('min-height:39rem;', 'min-height:33.5rem;', 1)
          s = s.replace('min-height:6.3rem', 'min-height:4.6rem', 1)
          if 'FINAL-COMPLETION-STYLES' not in s:
              s += r'''

/* FINAL-COMPLETION-STYLES */
.home-v10 img{image-rendering:auto;-webkit-font-smoothing:antialiased;backface-visibility:hidden;}
.home-v10 .v10-media img,.gallery-v10__mosaic img,.world-v10__visual img,.sample-v10 img{filter:none!important;transform:translateZ(0);}

/* A real automatic 24-second motion film made from sharp in-site frames. */
.film-v10__player--motion{overflow:hidden;background:#020915;}
.system-reel{position:absolute;inset:0;overflow:hidden;background:#020915;}
.system-reel__slide{position:absolute;inset:0;margin:0;opacity:0;transform:scale(1.025);animation:systemReel 24s linear infinite;}
.system-reel__slide img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.04);}
.system-reel__slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,7,16,.04) 44%,rgba(1,7,16,.82) 100%);}
.system-reel__slide figcaption{position:absolute;z-index:2;left:1.2rem;right:1.2rem;bottom:4.5rem;display:flex;flex-direction:column;gap:.35rem;padding:1rem 1.05rem;border:1px solid rgba(112,169,238,.22);border-radius:.9rem;background:rgba(2,9,20,.68);backdrop-filter:blur(14px);color:#fff;}
.system-reel__slide figcaption small{font:850 .62rem/1 var(--font-mono);letter-spacing:.13em;color:#59e0d8;}
.system-reel__slide figcaption b{max-width:34rem;font:760 1.05rem/1.25 var(--font-display);}
.system-reel__slide--1{animation-delay:0s}.system-reel__slide--2{animation-delay:4s}.system-reel__slide--3{animation-delay:8s}.system-reel__slide--4{animation-delay:12s}.system-reel__slide--5{animation-delay:16s}.system-reel__slide--6{animation-delay:20s}
@keyframes systemReel{0%{opacity:0;transform:scale(1.035)}2.5%{opacity:1}14%{opacity:1;transform:scale(1.0)}16.5%{opacity:0}100%{opacity:0}}

/* Pricing stays premium but no longer consumes an unnecessary full screen and a half. */
.price-card{padding:1.35rem 1.45rem;}
.price-card h3{font-size:1.55rem;margin-top:1rem;}
.price-card__price{margin-top:1rem;padding:.9rem 1rem;}
.price-card__price strong{font-size:clamp(2.45rem,3vw,3.55rem);}
.price-card__delivery{padding:.8rem 1rem;}
.price-card ul{margin-top:.85rem;gap:.38rem;}
.price-card>a{margin-top:1rem;}

/* Exactly what the buyer is purchasing. */
.deliverables-v10{padding:clamp(5rem,7vw,7rem) 0;background:linear-gradient(180deg,#f6efe5 0%,#fbf8f3 100%);color:#0c1420;}
.deliverables-v10__head{display:grid;grid-template-columns:1.05fr .75fr;gap:clamp(2rem,5vw,5rem);align-items:end;}
.deliverables-v10__head h2{max-width:11ch;margin:.7rem 0 0;font-size:clamp(2.7rem,4.8vw,5.2rem);line-height:.94;letter-spacing:-.055em;}
.deliverables-v10__head>p{max-width:47rem;margin:0;color:#586678;font-size:1rem;line-height:1.72;}
.deliverables-v10__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.4rem;}
.deliverables-v10__grid article{position:relative;min-height:16.3rem;padding:1.35rem;border:1px solid rgba(38,59,83,.12);border-radius:1.15rem;background:rgba(255,255,255,.72);box-shadow:0 22px 55px rgba(36,45,58,.09);}
.deliverables-v10__grid article>span{position:absolute;right:1.1rem;top:1rem;font:850 2.1rem/1 var(--font-display);color:rgba(37,89,148,.13);}
.deliverables-v10__grid small{font:850 .61rem/1 var(--font-mono);letter-spacing:.12em;color:#1a7fa7;}
.deliverables-v10__grid h3{max-width:13ch;margin:.7rem 0 .6rem;font-size:1.34rem;line-height:1.08;letter-spacing:-.025em;}
.deliverables-v10__grid p{margin:0;color:#617084;font-size:.86rem;line-height:1.58;}
.deliverables-v10__bottom{display:flex;flex-wrap:wrap;gap:.65rem 1rem;align-items:center;margin-top:1rem;padding:1rem 1.15rem;border-radius:.9rem;background:#08172a;color:#dce8f8;}
.deliverables-v10__bottom b{color:#58ded7}.deliverables-v10__bottom span{color:#fff}.deliverables-v10__bottom a{margin-left:auto;color:#9fc1ff;text-decoration:none;font-weight:800;}

/* Keep preview/UI screenshots crisp by containing them rather than stretching tiny raster detail. */
.outputs-v10__gallery .v10-media img{object-fit:contain;background:#06111f;}
.outputs-v10__gallery .v10-media{background:#06111f;}

@media(max-width:900px){.deliverables-v10__head{grid-template-columns:1fr}.deliverables-v10__grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.deliverables-v10__grid{grid-template-columns:1fr}.deliverables-v10__grid article{min-height:auto}.deliverables-v10__bottom a{margin-left:0;width:100%}.system-reel__slide figcaption{bottom:4rem}}
@media(prefers-reduced-motion:reduce){.system-reel__slide{animation:none;opacity:0}.system-reel__slide--1{opacity:1;transform:none}}
'''
          p.write_text(s)

          # ---------- GLOBAL INTERNAL PAGE VISUAL QUALITY / DENSITY ----------
          p = Path('src/styles/site-final.css')
          s = p.read_text()
          if 'INTERNAL-COMPLETION-STYLES' not in s:
              s += r'''

/* INTERNAL-COMPLETION-STYLES */
.approved-page-visual{padding:clamp(1.3rem,2.8vw,2.4rem) 0 clamp(2rem,4vw,3.5rem);background:linear-gradient(180deg,#06111f 0%,#0a1830 58%,#f8f3eb 100%);}
.approved-page-visual__inner{max-width:92rem;}
.approved-page-visual__frame{position:relative;margin:0;overflow:hidden;border-radius:1.35rem;border:1px solid rgba(102,165,243,.28);background:#06111f;box-shadow:0 36px 86px rgba(7,21,39,.27);}
.approved-page-visual__frame img{display:block;width:100%;height:auto;max-height:42rem;object-fit:contain;background:#06111f;image-rendering:auto;filter:none;}
.section .receive,.section .mi-card,.section .ctx{box-shadow:0 22px 52px rgba(26,39,56,.08);transition:transform .18s ease,box-shadow .18s ease;}
.section .receive:hover,.section .mi-card:hover,.section .ctx:hover{transform:translateY(-4px);box-shadow:0 30px 68px rgba(26,39,56,.13);}
.section[id]{scroll-margin-top:6.5rem;}
'''
          p.write_text(s)

          # Remove trigger marker.
          Path('final-site-completion.ready').unlink(missing_ok=True)
          PY

      - name: Build QA
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Static internal-link sanity check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          routes = {'/'}
          for p in Path('src/pages').glob('*.astro'):
              if p.name in {'index.astro','404.astro','report-print.astro'}: continue
              routes.add('/' + p.stem + '/')
          public = Path('public')
          missing=[]
          for p in list(Path('src/pages').glob('*.astro')) + list(Path('src/components').glob('*.astro')):
              text=p.read_text()
              for href in re.findall(r'href="([^"]+)"', text):
                  if href.startswith(('http:','https:','mailto:','#','javascript:')): continue
                  path=href.split('#',1)[0]
                  if not path: continue
                  if path.startswith('/assets/') or path.startswith('/report/'):
                      if not (public / path.lstrip('/')).exists(): missing.append((str(p),href))
                  elif path.startswith('/') and path not in routes:
                      # Ignore framework/static known paths handled elsewhere.
                      if not (public / path.lstrip('/')).exists(): missing.append((str(p),href))
          if missing:
              print('Missing static internal targets:')
              for item in missing: print(item)
              raise SystemExit(1)
          print('Static internal links: OK')
          PY

      - name: Commit final completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Evidence Axis Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Evidence Axis homepage, links and content QA' || exit 0
          git push
