name: Install Evidence Axis v11 assets

on:
  push:
    branches:
      - redesign-v10
    paths:
      - 'assets-v11.zip.b64'

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode approved media bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f assets-v11.zip.b64 ]; then
            echo 'No bundle present; nothing to do.'
            exit 0
          fi
          base64 --decode assets-v11.zip.b64 > /tmp/assets-v11.zip
          mkdir -p public/assets/v10
          unzip -qo /tmp/assets-v11.zip -d public/assets/v10
          rm -f assets-v11.zip.b64

      - name: Commit installed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Evidence Axis Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Install approved Evidence Axis v11 media assets' || exit 0
          git push
