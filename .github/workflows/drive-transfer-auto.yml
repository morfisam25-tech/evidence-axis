name: Drive transfer auto
on:
  push:
    branches:
      - fix/captioned-founder-video
    paths:
      - '.github/workflows/drive-transfer-auto.yml'
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try direct Drive download
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 'https://drive.google.com/uc?export=download&id=1dT6-aOchQ4xW6nEM4XLzpdP4X6amFUu1' -o /tmp/video.mp4
          file /tmp/video.mp4
          test $(stat -c%s /tmp/video.mp4) -gt 5000000
