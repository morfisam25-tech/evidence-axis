name: Add founder captions track

on:
  push:
    paths:
      - '.github/workflows/add-founder-captions-track.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add default caption track
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/index.astro')
          s = p.read_text()
          source = '            <source src="/assets/founder/evidence-axis-founder-explainer-720p.mp4" type="video/mp4" />\n'
          track = '            <track kind="captions" src="/assets/founder/evidence-axis-founder-explainer.vtt" srclang="en" label="English" default />\n'
          if track not in s:
              if source not in s:
                  raise SystemExit('Founder video source marker not found')
              s = s.replace(source, source + track, 1)
              p.write_text(s)
          PY
      - name: Commit caption track
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Show captions on homepage founder video"
          git push
