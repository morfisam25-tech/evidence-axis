name: tracking-v2-production-smoke
# run 9 direct Cloudflare Pages endpoint smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tracking-v2-production-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST production tracking endpoint
        run: |
          TOKEN="EA-ENDPOINT-SMOKE-$(date +%s)"
          echo "SMOKE_TOKEN=$TOKEN"
          BODY=$(printf '{"event":"delivery-page-viewed","company":"Cloverleaf AI","delivery_slug":"cloverleaf-brief-8d7c1f4a","delivery_token":"%s","visitor_id":"smoke-visitor","session_id":"smoke-session","timestamp_utc":"%s","dwell_ms":"5100","classification":"likely_scanner","classification_reason":"smoke_test","page_url":"https://evidenceaxis.com/intelligence/cloverleaf-brief-8d7c1f4a/?d=%s","visibility_state":"visible","has_focus":"true","webdriver":"true","language":"en-US","timezone":"UTC","screen":"1280x720","viewport":"1280x720"}' "$TOKEN" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TOKEN")
          HTTP=$(curl -sS -o /tmp/ea-response.txt -w '%{http_code}' \
            -X POST 'https://evidenceaxis.com/api/track' \
            -H 'Origin: https://evidenceaxis.com' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: EvidenceAxis-Smoke-Test/1.0' \
            --data "$BODY")
          echo "HTTP_STATUS=$HTTP"
          echo -n "RESPONSE_BODY=" && cat /tmp/ea-response.txt && echo
          test "$HTTP" = "200"
