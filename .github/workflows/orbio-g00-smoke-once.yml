name: orbio-g00-smoke-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbio-g00-smoke-once.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Playwright
        run: |
          mkdir -p /tmp/orbio-g00
          cd /tmp/orbio-g00
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test Orbio production delivery and G-00
        run: |
          cd /tmp/orbio-g00
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const token = `EA-ORB-G00-${Date.now()}`;
          const base = 'https://evidenceaxis.com';
          const slug = 'orbio-brief-1734efba';
          const url = `${base}/intelligence/${slug}/?d=${token}`;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const responses = [];
          const failures = [];
          const consoleErrors = [];
          page.on('response', async r => {
            const u = r.url();
            if (u.includes('delivery-tracking-v4.js') || u.includes('/api/track')) {
              let body = null;
              if (u.includes('/api/track')) { try { body = await r.json(); } catch {} }
              responses.push({url:u,status:r.status(),body});
            }
          });
          page.on('requestfailed', r => {
            const u = r.url();
            if (u.includes('delivery-tracking-v4.js') || u.includes('/api/track') || u.includes('formsubmit.co')) failures.push({url:u,error:r.failure()?.errorText || 'unknown'});
          });
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          let status = 'FAIL'; let error = ''; let debug = null; let pdfChecks = [];
          try {
            const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (!res || !res.ok()) throw new Error(`delivery page HTTP ${res?.status()}`);
            if (!(await page.locator('script[src*="delivery-tracking-v4.js"]').count())) throw new Error('v4 script missing');

            for (const [name, href] of [['deck', `${base}/deliveries/${slug}/deck.pdf`], ['appendix', `${base}/deliveries/${slug}/appendix.pdf`]]) {
              const r = await context.request.get(href);
              pdfChecks.push({name,status:r.status(),contentType:r.headers()['content-type'] || '',length:(await r.body()).length});
              if (!r.ok()) throw new Error(`${name} PDF HTTP ${r.status()}`);
              if (!(r.headers()['content-type'] || '').toLowerCase().includes('pdf')) throw new Error(`${name} content-type not PDF: ${r.headers()['content-type'] || ''}`);
            }

            await page.waitForTimeout(6500);
            const clickEvent = async eventName => {
              const el = page.locator(`[data-delivery-event="${eventName}"]`);
              if (!(await el.count())) throw new Error(`${eventName} link missing`);
              await page.evaluate((eventName) => {
                const el = document.querySelector(`[data-delivery-event="${eventName}"]`);
                el.addEventListener('click', e => e.preventDefault(), {once:true});
                el.click();
              }, eventName);
              await page.waitForTimeout(1200);
            };
            await clickEvent('executive-deck-opened');
            await clickEvent('evidence-appendix-opened');
            await clickEvent('decision-conversation-clicked');
            await page.waitForTimeout(2500);

            debug = await page.evaluate(() => window.__eaTrackingV4 || null);
            const required = ['delivery-page-viewed','executive-deck-opened','evidence-appendix-opened','decision-conversation-clicked'];
            for (const event of required) {
              if (!debug?.emitted?.some(x => x.event === event)) throw new Error(`${event} not emitted`);
            }
            const api = responses.filter(x => x.url.includes('/api/track'));
            for (const event of required) {
              if (!api.some(x => x.status === 200 && x.body?.recorded === true && x.body?.event === event)) throw new Error(`${event} not recorded by first-party API`);
            }
            if (!api.length || !api.every(x => x.body?.classification === 'likely_scanner')) throw new Error(`headless events were not all scanner-classified: ${JSON.stringify(api)}`);
            if ((debug.emailSubmitted || []).length !== 0) throw new Error(`scanner generated email copy: ${JSON.stringify(debug.emailSubmitted)}`);
            if (failures.some(x => x.url.includes('formsubmit.co'))) throw new Error('FormSubmit request fired for scanner');
            status = 'PASS';
          } catch (e) { error = String(e?.stack || e); }
          const result = {status,token,url,tested_at_utc:new Date().toISOString(),pdfChecks,responses,failures,consoleErrors,debug,error};
          writeFileSync('/tmp/orbio-g00/result.json', JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          EOF
          node smoke.mjs || true
          cp /tmp/orbio-g00/result.json "$GITHUB_WORKSPACE/docs/orbio-g00-smoke-result.json"
      - name: Commit smoke result safely
        run: |
          cp docs/orbio-g00-smoke-result.json /tmp/orbio-g00-final.json
          git checkout -- docs/orbio-g00-smoke-result.json || true
          git pull --rebase origin main
          cp /tmp/orbio-g00-final.json docs/orbio-g00-smoke-result.json
          git config user.name "Evidence Axis Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/orbio-g00-smoke-result.json
          git commit -m "Record Orbio G-00 production smoke" || exit 0
          git push origin HEAD:main
