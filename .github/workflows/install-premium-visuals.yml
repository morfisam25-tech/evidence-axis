name: Install premium Evidence Axis visuals

on:
  push:
    branches:
      - redesign-v10
    paths:
      - 'premium-visuals.ready'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install premium visuals
        run: python3 scripts/install-premium-visuals.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit completed visual pass
        run: |
          git config user.name "Evidence Axis Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages
          if git diff --cached --quiet; then
            echo "No visual changes to commit"
          else
            git commit -m "Install premium visuals and eliminate white placeholders"
            git push origin HEAD:redesign-v10
          fi
