name: meticulous-install-final-pdfs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meticulous-install-final-pdfs.yml'
      - 'docs/meticulous-install-trigger.txt'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact final PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib

          root = Path('scripts/meticulous-pdf-parts-v2')
          out = Path('public/deliveries/meticulous-brief-fed5761c')
          out.mkdir(parents=True, exist_ok=True)
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def stream(paths):
              text = ''.join((root / p).read_text(encoding='utf-8') for p in paths)
              return re.sub(r'[^A-Za-z0-9+/=]', '', text).replace('=', '')

          def b64decode(text):
              padded = text + '=' * ((-len(text)) % 4)
              return base64.b64decode(padded, validate=True)

          def verify(label, pdf, expected_len, expected_sha):
              sha = hashlib.sha256(pdf).hexdigest()
              print(f'{label}: bytes={len(pdf)} sha256={sha}')
              if len(pdf) != expected_len or sha != expected_sha:
                  raise SystemExit(f'{label} locked integrity mismatch')
              (out / label).write_bytes(pdf)

          deck_text = stream([f'deck.{i:02d}.b64' for i in range(1, 7)])
          deck_pdf = zlib.decompress(b64decode(deck_text), 16 + zlib.MAX_WBITS)
          verify('deck.pdf', deck_pdf, 57385, '00cd6e7757909f0bf4b8dce80d9f042152587fc5f2134a0989a65792d11e7c73')

          appendix_text = stream([f'appendix.{i:02d}.b64' for i in range(1, 7)])
          split = stream(['appendix.06a.b64', 'appendix.06b.b64'])
          whole = stream(['appendix.06.b64'])
          if split != whole:
              raise SystemExit('appendix.06 split/whole staging mismatch')
          print(f'appendix staged unpadded chars={len(appendix_text)}; exhaustive recovery in final staged chunk')

          expected_sha = '6cae8a7db177956fe08c643868f36bc6c01dc5319288bc37969a1c6b75f0ecdf'
          found = None
          lo, hi = 60000, len(appendix_text)
          for pos in range(lo, hi + 1):
              left, right = appendix_text[:pos], appendix_text[pos:]
              for ch in alphabet:
                  try:
                      pdf = zlib.decompress(b64decode(left + ch + right), 16 + zlib.MAX_WBITS)
                  except (zlib.error, ValueError):
                      continue
                  if len(pdf) == 109181 and hashlib.sha256(pdf).hexdigest() == expected_sha:
                      found = (pos, ch, pdf)
                      break
              if found:
                  break
          if not found:
              raise SystemExit(f'missing base64 char not found in final chunk search {lo}:{hi}')
          pos, ch, appendix_pdf = found
          print(f'appendix recovery match: insert position={pos}, char={ch!r}')
          verify('appendix.pdf', appendix_pdf, 109181, expected_sha)
          PY
          file public/deliveries/meticulous-brief-fed5761c/deck.pdf public/deliveries/meticulous-brief-fed5761c/appendix.pdf

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit verified PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Evidence Axis Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/deliveries/meticulous-brief-fed5761c/deck.pdf public/deliveries/meticulous-brief-fed5761c/appendix.pdf
          if git diff --cached --quiet; then
            echo 'Verified PDFs already installed.'
            exit 0
          fi
          git commit -m 'Install verified Meticulous Gift #16 PDFs'
          git pull --rebase origin main
          git push origin HEAD:main
