name: meticulous-install-final-pdfs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meticulous-install-final-pdfs.yml'
      - 'docs/meticulous-install-trigger.txt'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact final PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          root = Path('scripts/meticulous-pdf-parts-v2')
          out = Path('public/deliveries/meticulous-brief-fed5761c')
          out.mkdir(parents=True, exist_ok=True)

          def normalized_text(paths):
              text = ''.join((root / p).read_text(encoding='utf-8') for p in paths)
              text = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              # Padding is meaningful only at the end of one base64 stream.
              text = text.replace('=', '')
              text += '=' * ((-len(text)) % 4)
              return text

          def materialize(label, parts, expected_len, expected_sha):
              encoded = normalized_text(parts)
              packed = base64.b64decode(encoded, validate=True)
              pdf = gzip.decompress(packed)
              actual_sha = hashlib.sha256(pdf).hexdigest()
              print(f'{label}: encoded={len(encoded)} packed={len(packed)} pdf={len(pdf)} sha256={actual_sha}')
              if len(pdf) != expected_len:
                  raise SystemExit(f'{label} length mismatch {len(pdf)} != {expected_len}')
              if actual_sha != expected_sha:
                  raise SystemExit(f'{label} sha256 mismatch {actual_sha} != {expected_sha}')
              (out / label).write_bytes(pdf)

          split = normalized_text(['appendix.06a.b64', 'appendix.06b.b64'])
          whole = normalized_text(['appendix.06.b64'])
          if split != whole:
              raise SystemExit('appendix.06 split/whole staging mismatch')

          materialize(
              'deck.pdf',
              [f'deck.{i:02d}.b64' for i in range(1, 7)],
              57385,
              '00cd6e7757909f0bf4b8dce80d9f042152587fc5f2134a0989a65792d11e7c73',
          )
          materialize(
              'appendix.pdf',
              [f'appendix.{i:02d}.b64' for i in range(1, 7)],
              109181,
              '6cae8a7db177956fe08c643868f36bc6c01dc5319288bc37969a1c6b75f0ecdf',
          )
          PY
          file public/deliveries/meticulous-brief-fed5761c/deck.pdf public/deliveries/meticulous-brief-fed5761c/appendix.pdf

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit verified PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Evidence Axis Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/deliveries/meticulous-brief-fed5761c/deck.pdf public/deliveries/meticulous-brief-fed5761c/appendix.pdf
          if git diff --cached --quiet; then
            echo 'Verified PDFs already installed.'
            exit 0
          fi
          git commit -m 'Install verified Meticulous Gift #16 PDFs'
          git pull --rebase origin main
          git push origin HEAD:main
