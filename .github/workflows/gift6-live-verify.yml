name: Gift 6 Live Verification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production deployment
        run: sleep 90

      - name: Verify live page and delivery files
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://evidenceaxis.com/intelligence/aisel-uk-brief-a9f2c7e4/'
          DECK='https://evidenceaxis.com/deliveries/aisel-uk-brief-a9f2c7e4/deck.pdf'
          APPENDIX='https://evidenceaxis.com/deliveries/aisel-uk-brief-a9f2c7e4/appendix.pdf'
          mkdir -p verify

          curl --retry 6 --retry-delay 10 --retry-all-errors -fsSL "$PAGE" -o verify/page.html
          curl --retry 4 --retry-delay 5 --retry-all-errors -fsSL "$DECK" -o verify/live-deck.pdf
          curl --retry 4 --retry-delay 5 --retry-all-errors -fsSL "$APPENDIX" -o verify/live-appendix.pdf

          grep -Fq 'PRIVATE EVIDENCE AXIS DELIVERY' verify/page.html
          grep -Fq 'Aisel Health' verify/page.html
          grep -Fq 'Prepared for Augusta Klingsten Peytz · Founder &amp; CEO' verify/page.html || grep -Fq 'Prepared for Augusta Klingsten Peytz · Founder & CEO' verify/page.html
          grep -Fq 'UK entry competitive brief — NHS procurement route, public assurance signals, and mental-health workflow pressure.' verify/page.html
          grep -Fq 'data-delivery-event="executive-deck-opened"' verify/page.html
          grep -Fq 'data-delivery-event="evidence-appendix-opened"' verify/page.html
          grep -Fq 'data-delivery-event="decision-conversation-clicked"' verify/page.html
          grep -Fq 'delivery-page-viewed' verify/page.html
          grep -Fq 'https://formsubmit.co/ajax/sai@evidenceaxis.com' verify/page.html
          grep -Fq 'noindex, nofollow' verify/page.html
          grep -Fq 'hero-inner' verify/page.html

          test "$(head -c 4 verify/live-deck.pdf)" = '%PDF'
          test "$(head -c 4 verify/live-appendix.pdf)" = '%PDF'
          cmp -s verify/live-deck.pdf public/deliveries/aisel-uk-brief-a9f2c7e4/deck.pdf
          cmp -s verify/live-appendix.pdf public/deliveries/aisel-uk-brief-a9f2c7e4/appendix.pdf

          echo 'LIVE_PAGE=PASS'
          echo 'LIVE_PDFS_HTTP=PASS'
          echo 'LIVE_PDFS_MATCH_REPO=PASS'
          echo 'REPO_DECK_SHA256='$(sha256sum public/deliveries/aisel-uk-brief-a9f2c7e4/deck.pdf | awk '{print $1}')
          echo 'REPO_APPENDIX_SHA256='$(sha256sum public/deliveries/aisel-uk-brief-a9f2c7e4/appendix.pdf | awk '{print $1}')
          echo 'LIVE_DECK_BYTES='$(wc -c < verify/live-deck.pdf)
          echo 'LIVE_APPENDIX_BYTES='$(wc -c < verify/live-appendix.pdf)

      - name: Inspect PDF metadata and text anchors
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdfinfo verify/live-deck.pdf | grep -E '^(Pages|Page size|PDF version):'
          pdfinfo verify/live-appendix.pdf | grep -E '^(Pages|Page size|PDF version):'
          pdftotext -layout verify/live-deck.pdf verify/deck.txt
          pdftotext -layout verify/live-appendix.pdf verify/appendix.txt
          grep -Fq 'Public evidence checked 27 Aug 2026' verify/deck.txt
          grep -Fq 'Aisel just raised to scale a psychiatry-specific operating system into the UK.' verify/deck.txt
          grep -Fq 'What a paid sprint would answer' verify/deck.txt
          grep -Fq 'Aisel Health - UK Entry Competitive Brief' verify/appendix.txt
          grep -Fq 'Fact / Inference / Unknown separated' verify/appendix.txt
          grep -Fq 'Final guardrails' verify/appendix.txt
          echo 'PDF_CONTENT_ANCHORS=PASS'

      - name: Capture live desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://evidenceaxis.com/intelligence/aisel-uk-brief-a9f2c7e4/'
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1050 --screenshot=verify/desktop.png "$PAGE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=verify/mobile.png "$PAGE"
          test -s verify/desktop.png
          test -s verify/mobile.png
          echo 'SCREENSHOTS=PASS'

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gift6-live-verification
          path: verify/
          if-no-files-found: warn
          retention-days: 1
