name: Gift 6 Build Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated Gift 6 page
        run: |
          set -euo pipefail
          PAGE='dist/intelligence/aisel-uk-brief-a9f2c7e4/index.html'
          test -s "$PAGE"
          grep -Fq 'hero-inner' "$PAGE"
          grep -Fq 'Aisel Health' "$PAGE"
          grep -Fq 'https://formsubmit.co/ajax/sai@evidenceaxis.com' "$PAGE"
          grep -Fq 'noindex, nofollow' "$PAGE"
          test -s dist/deliveries/aisel-uk-brief-a9f2c7e4/deck.pdf
          test -s dist/deliveries/aisel-uk-brief-a9f2c7e4/appendix.pdf
          echo 'GIFT6_BUILD=PASS'
