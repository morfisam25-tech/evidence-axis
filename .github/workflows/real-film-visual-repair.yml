name: Real film and visual repair

on:
  push:
    branches:
      - redesign-v10
    paths:
      - 'real-film-visual-repair.ready'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python3 scripts/fix-real-film-and-broken-visuals.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit repaired site
        run: |
          git config user.name "Evidence Axis Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/index.astro src/styles/home-final.css src/styles/site-final.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace slideshow with real film and remove broken visuals"
            git push origin HEAD:redesign-v10
          fi
